name: verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run risk-routed verification
        shell: pwsh
        run: ./scripts/verify-change.ps1 -Mode ci -ReceiptPath .verification/ci-receipt.json

      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipt
          path: .verification/ci-receipt.json
